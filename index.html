<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>오늘의 과제</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f5f5f5;

            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        .buttons a {
            width: 160px;
            padding: 25px 20px;

            background-color: white;

            border: 1px solid #ccc;
            border-radius: 10px;

            text-decoration: none;
            color: #333;

            font-size: 18px;

            transition: 0.2s;
        }

        .buttons a:hover {
            background-color: #333;
            color: white;

            transform: translateY(-5px);
        }
    </style>
</head>


<body>

    <div class="container">

        <h1>오늘의 과제</h1>

        <div class="buttons">

            <a href="./Card/index.html">
                과제 1
            </a>

            <a href="./task2/index.html">
                과제 2
            </a>

            <a href="./task3/index.html">
                과제 3
            </a>

        </div>

    </div>

</body>

</html>
