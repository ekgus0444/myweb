<body class="story-page">

<div class="book">

            <h1>나는 왜 다르지?</h1>

            <p>
                아기 오리는 형제들과 함께<br>
                처음으로 세상 밖으로 나왔어요.
            </p>

            <h2>“첨벙!”</h2>

            <p>
                물속에서는 누구보다 자연스럽게<br>
                헤엄칠 수 있었지요.
            </p>

            <h2>
                “저 아이는 왜 저렇게 다르지?”
            </h2>

            <p>
                다른 오리들의 시선에<br>
                아기 오리는 조용히<br>
                고개를 숙였어요.
            </p>

        <!-- 오른쪽 이미지 -->
