<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미운 아기 오리 - 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="story-page">

<div class="book">

    <!-- 상단 애니메이션 -->
    <div class="page2-animation">

        <div class="big-hatch">

            <span class="tap tap1">톡</span>
            <span class="tap tap2">톡</span>


            <!-- 회색 아기 오리 -->
            <div class="gray-duck-head">

                <div class="gray-eye gray-left"></div>
                <div class="gray-eye gray-right"></div>

                <div class="gray-beak"></div>

            </div>


            <!-- 큰 알 -->
            <div class="page2-egg">

                <span class="page2-crack">⌁</span>

            </div>

        </div>

    </div>


    <!-- 내용 -->
    <div class="content">

        <!-- 왼쪽 -->
        <section class="story">

            <span class="chapter">02</span>

            <h1>마지막 알</h1>

            <p>
                다른 아기 오리들이 모두 태어났지만<br>
                커다란 알 하나만<br>
                조용히 남아 있었어요.
            </p>

            <h2>“쩍!”</h2>

            <p>
                마침내 커다란 알이 갈라지고,<br>
                크고 회색인 아기 오리가<br>
                모습을 드러냈어요.
            </p>

            <h2>
                “어머, 정말 커다란 아이구나!”
            </h2>


            <!-- 페이지 이동 -->
            <div class="page-nav">

                <a href="page1.html">
                    ← 이전 이야기
                </a>

                <a href="page3.html">
                    다음 이야기 →
                </a>

            </div>

        </section>


        <!-- 오른쪽 이미지 -->
        <section class="picture">

            <img
                src="images/page2.png"
                alt="커다란 알에서 태어난 회색 아기 오리"
            >

        </section>

    </div>

</div>

</body>
</html>
