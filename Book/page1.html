<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미운 아기 오리 - 1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="story-page">

<div class="book">

    <!-- 상단 알 애니메이션 -->
    <div class="animation-area">

        <div class="egg-box egg1">
            <div class="duck-head">
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>
                <div class="beak"></div>
            </div>

            <div class="egg">
                <span class="crack">⌁</span>
            </div>
        </div>


        <div class="egg-box egg2">
            <div class="duck-head">
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>
                <div class="beak"></div>
            </div>

            <div class="egg">
                <span class="crack">⌁</span>
            </div>
        </div>


        <div class="egg-box egg3">
            <div class="duck-head">
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>
                <div class="beak"></div>
            </div>

            <div class="egg">
                <span class="crack">⌁</span>
            </div>
        </div>


        <div class="egg-box egg4">
            <div class="duck-head">
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>
                <div class="beak"></div>
            </div>

            <div class="egg">
                <span class="crack">⌁</span>
            </div>
        </div>


        <!-- 마지막 큰 알 -->
        <div class="egg-box last-egg">

            <span class="question">?</span>

            <div class="egg big-egg"></div>

        </div>

    </div>


    <!-- 내용 -->
    <div class="content">

        <!-- 왼쪽 글 -->
        <section class="story">

            <span class="chapter">01</span>

            <h1>톡! 톡!</h1>

            <p>
                마침내 알들이 하나씩<br>
                갈라지기 시작했어요.
            </p>

            <h2>“빽! 빽!”</h2>

            <p>
                작은 아기 오리들이<br>
                알껍데기 밖으로 고개를<br>
                쏙 내밀었어요.
            </p>

            <h2>“꽥! 꽥!”</h2>

            <p>
                새로운 세상을 만난 아기 오리들이<br>
                신나게 울어댔답니다.
            </p>


            <!-- 페이지 이동 -->
            <div class="page-nav">

                <a href="index.html">
                    ← 표지
                </a>

                <a href="page2.html">
                    다음 이야기 →
                </a>

            </div>

        </section>


        <!-- 오른쪽 이미지 -->
        <section class="picture">

            <img
                src="images/duck_hatching.jpg"
                alt="알에서 태어나는 아기 오리들"
            >

        </section>

    </div>

</div>

</body>
</html>
